[package]
name = "entangle-mirror"
version = "0.1.1"
edition = "2024"
description = "Easy setup for mirroring GitHub repos to Tangled.org in one command"
license = "MIT"
repository = "https://github.com/cyrusae/entangle"
homepage = "https://github.com/cyrusae/entangle"
readme = "README.md"
keywords = ["git", "tangled", "mirror", "forge", "atproto"]
categories = ["command-line-utilities", "development-tools"]
# Exclude tooling/editor state directories that must never ship in the crate.
exclude = [".chainlink", ".claude", ".mcp.json"]

# Keep the installed binary named `entangle` even though the crates.io package
# is `entangle-mirror` (the name `entangle` was already taken on crates.io).
# Users run `cargo install entangle-mirror` and get the `entangle` command.
[[bin]]
name = "entangle"
path = "src/main.rs"

[dependencies]
# Argument parsing — derive macros for declarative CLI definition
clap = { version = "4", features = ["derive"] }

# Interactive prompts (setup, Y/n confirmations, re-prompt on invalid input)
# Handles Ctrl+C gracefully out of the box
dialoguer = "0.11"

# Spinners and progress bars for network calls (ls-refs can take a moment)
indicatif = "0.17"

# Terminal colors — lightweight, no runtime deps
owo-colors = "4"

# Config file serialization/deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Platform-aware config directory (~/.config on Unix, AppData\Roaming on Windows)
dirs = "5"

# All git operations: repo detection, remote inspection, push, ls-refs
# Using the full gix suite rather than shelling out to git
gix = { version = "0.83", features = ["blocking-network-client"] }

# Atomic file writes: unique temp file in same directory, then rename.
# Used by atomic_write in git.rs for .git/config and config.json writes.
tempfile = "3"

# rexpect uses Unix PTY APIs (via the `nix` crate) and cannot compile on
# Windows. The PTY test modules that use it are already gated with
# #[cfg(unix)], but Cargo compiles all [dev-dependencies] unconditionally
# regardless of #[cfg] usage in source. Restricting to cfg(unix) here
# prevents the Windows build from trying to compile rexpect at all.
[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.7.1"

[dev-dependencies]
mutants = "0.0.3"

